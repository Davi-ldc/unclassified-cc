# Generate config.yaml and the first client with: bash scripts/quick-setup.sh
# Supply the real Anthropic API key only through CC_GATEWAY_UPSTREAM_API_KEY.
server:
  host: 127.0.0.1
  port: 8443
  max_body_bytes: 33554432
  request_timeout_ms: 120000
  upstream_timeout_ms: 600000
  # Remote access requires an intentional bind change and trusted TLS.
  # tls:
  #   cert: ./certs/cert.pem
  #   key: ./certs/key.pem

upstream:
  url: https://api.anthropic.com
  user_agent: opencode/1.18.35

# Setup generates random client tokens; this reference has no usable credentials.
auth:
  tokens: []

logging:
  level: info
  audit: false
